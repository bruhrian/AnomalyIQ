<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/2-audit-log.css">
<title>AnomalyIQ - Audit Log</title>
</head>
<body>
<div class="shell">
<nav>
  <div class="nav-logo">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0f1117" stroke-width="2.5" stroke-linecap="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
  </div>
  <button class="nav-btn" id="nb-d" onclick="location.href='1-dashboard.html#dashboard'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    <div class="nav-tip">Dashboard</div>
  </button>
  <button class="nav-btn active" id="nb-a">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
    <div class="nav-tip">Audit Log</div>
  </button>
  <button class="nav-btn" id="nb-h" onclick="location.href='3-chat-history.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <div class="nav-tip">Chat History</div>
  </button>
  <div class="nav-div"></div>
  <button class="nav-btn" id="nb-livefeed" onclick="location.href='1-dashboard.html#livefeed'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
    <div class="nav-tip">Live Feed</div>
  </button>
  <button class="nav-btn" id="nb-analytics" onclick="location.href='1-dashboard.html#analytics'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    <div class="nav-tip">Analytics</div>
  </button>
  <div class="nav-space"></div>
  <div class="nav-div"></div>
  <button class="nav-btn" id="nb-profile" onclick="location.href='1-dashboard.html#profile'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.58-7 8-7s8 3 8 7"/></svg>
    <div class="nav-tip">Profile</div>
  </button>
</nav>

<div class="main">
  <div class="topbar">
    <span class="tb-title">ANOMALYIQ</span>
    <span class="tb-crumb" id="breadcrumb">/ Audit Log</span>
    <div class="tb-space"></div>
    <div class="status-pill"><div class="sdot-live"></div>Monitoring active</div>
    <div class="tb-clock" id="clk">--:--:--</div>
  </div>
  <div class="body">
    <div class="center">
      <!-- DASHBOARD VIEW -->

      <!-- AUDIT LOG VIEW -->
      <div id="view-audit" class="view active">
        <div class="vscroll">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:2px">
            <div class="sec-label">System Process Log</div>
            <div class="badge" id="entryCount">Loading...</div>
            <button onclick="loadAudit()" style="margin-left:auto;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.25);color:var(--accent);font-family:var(--font-mono);font-size:9px;padding:3px 10px;border-radius:5px;cursor:pointer;letter-spacing:.05em;">Refresh</button>
          </div>

          <div class="tabs">
            <button class="tab active" onclick="filterStage('all',this)">All Events</button>
            <button class="tab" onclick="filterStage('DETECT',this)">Detect</button>
            <button class="tab" onclick="filterStage('PROCESS',this)">Process</button>
            <button class="tab" onclick="filterStage('SUMMARY',this)">Summary</button>
            <button class="tab" onclick="filterStage('ANSWER',this)">Answer</button>
            <button class="tab" onclick="filterStage('COMM',this)">Agent Comms</button>
          </div>

          <div id="trailPanel" style="display:none;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:12px 16px;">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
              <span style="font-family:var(--font-mono);font-size:10px;color:var(--accent);">EVENT TRAIL</span>
              <span id="trailEventId" style="font-family:var(--font-mono);font-size:9px;color:var(--muted);"></span>
              <button onclick="closeTrail()" style="margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:var(--font-mono);font-size:9px;padding:2px 8px;border-radius:4px;cursor:pointer;">Close</button>
            </div>
            <div id="trailRows"></div>
          </div>

          <div class="audit-card">
            <div class="audit-head">
              <span class="audit-head-title">AUDIT TRAIL</span>
              <span class="badge">Detect -> Process -> Summary -> Answer</span>
              <span style="font-family:var(--font-mono);font-size:9px;color:var(--muted);margin-left:auto;">Click any row to drill in</span>
            </div>
            <div class="audit-row" style="background:var(--surface2);font-size:9px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;">
              <div>Time</div><div>Stage</div><div>Description</div><div>Machine</div>
            </div>
            <div id="auditBody">
              <div style="padding:20px;text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--muted);">
                Connecting to Audit API on port 8005...
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- CHAT HISTORY VIEW -->

    </div>

    <!-- CHAT PANEL -->
    <div class="chat-panel">
      <div class="chat-head">
        <div class="chat-avatar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 2a4 4 0 0 1 4 4v2H8V6a4 4 0 0 1 4-4z"/><rect x="4" y="8" width="16" height="12" rx="2"/><circle cx="9" cy="14" r="1" fill="white"/><circle cx="15" cy="14" r="1" fill="white"/></svg></div>
        <div><div class="chat-name">AnomalyIQ AI</div><div class="chat-sub">Diagnostic assistant</div></div>
        <div class="chat-live"></div>
      </div>
      <div class="chat-msgs" id="chatMsgs"></div>
      <div class="chat-input-row">
        <textarea class="chat-input" id="chatInput" placeholder="Ask about any machine..." rows="1"></textarea>
        <button class="send-btn" onclick="sendMsg()"><svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/></svg></button>
      </div>
    </div>
  </div>
</div>
</div>

<script src="/js/2-audit-log.js"></script>
</body>
</html>
